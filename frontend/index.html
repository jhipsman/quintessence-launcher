<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quintessence</title>
<link rel="stylesheet" href="./css/app.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Divider with a diamond -->
    <symbol id="divider" viewBox="0 0 400 16" preserveAspectRatio="none">
      <line x1="0" y1="8" x2="180" y2="8" stroke="currentColor" stroke-width="1"/>
      <line x1="220" y1="8" x2="400" y2="8" stroke="currentColor" stroke-width="1"/>
      <path d="M200 1 L207 8 L200 15 L193 8 Z" style="fill:var(--corrupt)"/>
      <circle cx="184" cy="8" r="1.6" fill="currentColor"/><circle cx="216" cy="8" r="1.6" fill="currentColor"/>
    </symbol>
  </defs>
</svg>

<!-- Own title bar (the window has no native frame) -->
<header class="titlebar" style="--wails-draggable:drag">
  <div class="tb-brand">
    <span class="tb-name">Quintessence</span>
  </div>
  <div class="tb-actions" style="--wails-draggable:no-drag">
    <button class="tb-btn" id="btn-settings" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg>
    </button>
    <button class="tb-btn" id="btn-min" title="Minimize" aria-label="Minimize">
      <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="1.6"><path d="M5 12.5h14"/></svg>
    </button>
    <button class="tb-btn tb-close" id="btn-close" title="Close" aria-label="Close">
      <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
</header>

<main class="stage">
  <canvas id="sky"></canvas>
  <div class="grain"></div>
  <div class="vignette"></div>

  <section class="content">
    <div class="hero">
      <h1 class="hero-title">Quintessence</h1>
      <p class="hero-tag">A private New World server</p>
      <svg class="divider"><use href="#divider"/></svg>

      <section class="panel panel-account">
        <header class="panel-head">
          <h2>Player</h2>
          <span class="panel-rule"></span>
        </header>
        <div class="account-body" id="account-out">
          <div class="account-col">
            <button type="button" class="btn-brass btn-sm" id="btn-name">Choose a player name</button>
            <p class="account-note">The server knows you by this name.</p>
          </div>
        </div>
        <div class="account-body" id="account-in" hidden>
          <div class="avatar" id="avatar">?</div>
          <div class="account-col">
            <div class="account-who">
              <span class="account-sub">Playing as</span>
              <span class="account-name" id="account-name">—</span>
            </div>
            <button type="button" class="btn-ghost btn-sm" id="btn-rename">Change</button>
          </div>
        </div>
      </section>

      <button class="btn-play" id="btn-play">
        <span class="btn-play-sheen"></span>
        <span class="btn-play-text">Play</span>
      </button>
      <p class="play-status" id="play-status" role="status" aria-live="polite"></p>
    </div>
  </section>

  <footer class="footer">
    <span id="foot-version">v0.1.0</span>
  </footer>

  <!-- Toast -->
  <div class="toast" id="toast" hidden></div>
</main>

<!-- Settings -->
<div class="modal" id="modal-settings" hidden>
  <div class="modal-panel panel">
    <header class="panel-head">
      <h2>Settings</h2>
      <span class="panel-rule"></span>
    </header>
    <form id="form-settings" autocomplete="off">
      <label class="field">
        <span class="field-label">Player name</span>
        <div class="field-row">
          <input type="text" id="in-name" spellcheck="false" maxlength="32" placeholder="3 to 32 letters, digits, - or _">
        </div>
        <span class="field-help">Sent to the server as your login name.</span>
      </label>
      <label class="field">
        <span class="field-label">Server</span>
        <div class="field-row">
          <input type="text" id="in-server" spellcheck="false" placeholder="host:port">
        </div>
        <span class="field-help" id="server-help">The game server, as <span class="mono">host:port</span> (for a server on this PC: <span class="mono">127.0.0.1:6000</span>).</span>
      </label>
      <label class="field">
        <span class="field-label">New World folder</span>
        <div class="field-row">
          <input type="text" id="in-game" spellcheck="false" placeholder="C:\…\New World">
          <button type="button" class="btn-ghost btn-sm" id="btn-browse">Browse…</button>
          <button type="button" class="btn-ghost btn-sm" id="btn-search">Search</button>
        </div>
        <span class="field-help">The folder that holds <span class="mono">Bin64\NewWorld.exe</span>. The launcher never changes its game files: the game runs from its own copy.</span>
      </label>
      <p class="search-status" id="search-status" hidden>
        <span class="spinner" id="search-spinner" hidden></span><span id="search-text"></span>
        <button type="button" class="btn-mini" id="btn-search-cancel" hidden>Cancel</button>
      </p>
      <ul class="candidates" id="candidates" hidden></ul>
      <label class="field">
        <span class="field-label">Game copy folder</span>
        <div class="field-row">
          <input type="text" id="in-copy" spellcheck="false" placeholder="Default">
          <button type="button" class="btn-ghost btn-sm" id="btn-browse-copy">Browse…</button>
        </div>
        <span class="field-help">Where the launcher keeps its copy of <span class="mono">Bin64</span> (about 270 MB), in a <span class="mono">QuintessenceClient</span> folder. Leave it empty for the default. Changing it deletes the old copy.</span>
      </label>
      <div class="modal-actions">
        <span class="grow"></span>
        <button type="button" class="btn-ghost btn-sm" id="btn-settings-cancel">Cancel</button>
        <button type="submit" class="btn-brass btn-sm" id="btn-settings-save">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="./js/bridge.js"></script>
<script src="./js/fx.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
